name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (debug)
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rincon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rincon-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Los artefactos de Actions se descargan en .zip, que un movil no puede
      # instalar. Publicar el APK como asset de una release da un enlace
      # directo al fichero, que si se instala desde el telefono.
      - name: Publicar APK como release descargable
        if: github.ref_name == 'claude/productivity-app-android-i8wbt6'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk rincon.apk
          cp app/build/outputs/apk/debug/app-debug.apk rincon-debug.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest rincon.apk rincon-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Rincón — APK más reciente" \
            --notes "APK instalable generado automáticamente desde el commit $GITHUB_SHA.

          - **rincon.apk** — versión optimizada (recomendada).
          - **rincon-debug.apk** — versión de depuración; se instala en paralelo, sin sustituir a la otra.

          Ambos van firmados con la clave de depuración: son instalables, pero no aptos para Google Play."

      - name: Upload test/lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
